<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylz - Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKzyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="./bag_13294469.png">
    <style>
        body {
            background-image: url('http://t0.gstatic.com/licensed-image?q=tbn:ANd9GcRAbecG_7gzaK2TBdALVv3bvi5EKT2S5MVeZmuzqm0Z52GsaadqytVyHOrG2asNG9J89V_S7T7C0tW8MVvgFSY');
        }
        .cart-header {
            background-color: #343a40;
            padding: 15px;
            text-align: center;
        }
        .cart-header a {
            color: rgb(204, 201, 201);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .cart-container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        .cart-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .cart-item img {
            width: 100px;
            height: auto;
            border-radius: 5px;
        }
        .item-info {
            margin-left: 15px;
            flex-grow: 1;
        }
        .cart-summary {
            text-align: center;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 400px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        .remove-item {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .remove-item:hover {
            background-color: #bb2d3b;
        }
    </style>
</head>
<body>

    <header class="cart-header">
        <a>CART</a>
    </header>

    <main class="cart-container">
        <h2 class="text-center">Items in Cart</h2>

        <div class="cart-item">
            <img src="https://www.westside.com/cdn/shop/files/300988177BROWN_2.jpg?v=1723620023&width=1445" alt="Elegant Dress">
            <div class="item-info">
                <h3>Elegant Dress</h3>
                <p>Size: M</p>
                <p>Price: ₹3,999</p>
                <button class="remove-item btn btn-danger">Remove</button>
            </div>
        </div>

        <div class="cart-item">
            <img src="https://sassafras.in/cdn/shop/files/SFTOPS42056_SFJEAN0575-1_6c755c76-d8ce-4b69-b89a-b04851c673de_1800x.jpg?v=1737714538" alt="Classic Denim">
            <div class="item-info">
                <h3>Classic Denim</h3>
                <p>Size: L</p>
                <p>Price: ₹2,999</p>
                <button class="remove-item btn btn-danger">Remove</button>
            </div>
        </div>
    </main>

    <div class="cart-summary">
        <h2>Cart Summary</h2>
        <p>Total: <strong>₹6,998</strong></p>
        <button class="btn btn-success w-100">Proceed to Checkout</button>
    </div>

</body>
</html>
