<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylz - Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="./bag_13294469.png">
    <style>
        body {
            background-image: url('http://t0.gstatic.com/licensed-image?q=tbn:ANd9GcRAbecG_7gzaK2TBdALVv3bvi5EKT2S5MVeZmuzqm0Z52GsaadqytVyHOrG2asNG9J89V_S7T7C0tW8MVvgFSY');
            font-family: Arial, sans-serif;
        }
        .catalog-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }
        .catalog-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.2s ease-in-out;
        }
        .catalog-item:hover {
            transform: scale(1.05);
        }
        .catalog-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }
        .add-to-cart {
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>
    <header class="text-center py-4 bg-dark text-white">
        <h1>Catalog</h1>
    </header>

    <main class="catalog-container">
        <div class="catalog-item">
            <img src="https://media.landmarkshops.in/cdn-cgi/image/h=730,w=540,q=85,fit=cover/max-new/1000013954146-Beige-BEIGE-1000013954146_03-2100.jpg" alt="T-Shirts">
            <h2>T-Shirts</h2>
            <button class="btn btn-dark add-to-cart">Add to Cart</button>
        </div>

        <div class="catalog-item">
            <img src="https://assets.myntassets.com/w_412,q_60,dpr_2,fl_progressive/assets/images/31038722/2024/12/2/b1ebd9ec-fe62-41bd-bddc-8e1e29788d4c1733130808829-HM-Bow-Long-Sleeve-Tops-31733130808418-1.jpg" alt="Tops">
            <h2>Tops</h2>
            <button class="btn btn-dark add-to-cart">Add to Cart</button>
        </div>

        <div class="catalog-item">
            <img src="https://www.westside.com/cdn/shop/files/300988177BROWN_2.jpg?v=1723620023&width=1445" alt="Dresses">
            <h2>Dresses</h2>
            <button class="btn btn-dark add-to-cart">Add to Cart</button>
        </div>

        <div class="catalog-item">
            <img src="https://sassafras.in/cdn/shop/files/SFTOPS42056_SFJEAN0575-1_6c755c76-d8ce-4b69-b89a-b04851c673de_1800x.jpg?v=1737714538" alt="Denim">
            <h2>Denim</h2>
            <button class="btn btn-dark add-to-cart">Add to Cart</button>
        </div>

        <div class="catalog-item">
            <img src="https://saclab.com/wp-content/uploads/2023/07/FWTrends24-Paris-str-Charm-Kelly.webp" alt="Bags">
            <h2>Bags</h2>
            <button class="btn btn-dark add-to-cart">Add to Cart</button>
        </div>

        <div class="catalog-item">
            <img src="https://www.gngmodels.com/wp-content/uploads/2022/10/female-footwear-photoshoot-2-682x1024.jpg" alt="Shoes">
            <h2>Shoes</h2>
            <button class="btn btn-dark add-to-cart">Add to Cart</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
